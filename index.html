<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:#ffffff; margin:0; padding:56px 64px;
    color:#141821;
  }
  .top{ display:flex; align-items:center; gap:18px; margin-bottom:48px; }
  .top img{ height:34px; }
  .top .divider{ width:1px; height:28px; background:#e2e5ea; }
  .top h1{ font-size:20px; font-weight:600; margin:0; letter-spacing:-.2px; }
  .top p{ font-size:12.5px; color:#8b93a1; margin:2px 0 0; }

  .searchWrap{ margin-bottom:36px; }
  #search{
    border:none; border-bottom:1.5px solid #e2e5ea; padding:10px 2px;
    font-size:14px; width:100%; color:#141821; background:transparent;
    font-family:inherit;
  }
  #search:focus{ outline:none; border-bottom-color:#0B2E54; }
  #search::placeholder{ color:#b7bcc6; }

  #list{ }
  .row{
    display:flex; align-items:center; gap:22px;
    padding:26px 4px; border-bottom:1px solid #eef0f3;
    cursor:pointer; background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left; font-family:inherit;
  }
  .row:hover{ background:#fafbfc; }
  #list .row:first-child{ border-top:1px solid #eef0f3; }
  .accent{ width:4px; height:44px; border-radius:2px; flex:none; }
  .row .icon{ font-size:26px; flex:none; width:34px; text-align:center; }
  .row .txt{ flex:1; min-width:0; }
  .row .txt .name{ font-size:16px; font-weight:600; margin:0 0 3px; color:#141821; }
  .row .txt .desc{ font-size:12.5px; color:#8b93a1; margin:0; line-height:1.5; }
  .row .arrow{ font-size:18px; color:#c3c8d1; flex:none; }

  /* Carrés de sélection des dossiers (écran d'accueil) */
  .radialWrap{
    position:relative; width:100%; max-width:560px; margin:8px auto 24px;
  }
  .radialWrap::before{ content:""; display:block; padding-top:100%; }
  .radialInner{ position:absolute; inset:0; }
  .radialLines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .radialNode{
    position:absolute; transform:translate(-50%,-50%);
    width:27%; aspect-ratio:1/1; border-radius:50%;
    border:1.5px solid; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:8px; text-align:center; transition:transform .15s ease, box-shadow .15s ease;
  }
  .radialNode:hover{ transform:translate(-50%,-50%) scale(1.06); box-shadow:0 8px 20px rgba(20,30,60,.16); z-index:2; }
  .radialNode .radialNodeIcon{ font-size:clamp(16px, 4.5vw, 24px); }
  .radialNode .radialNodeName{ font-size:clamp(8.5px, 2vw, 11px); font-weight:800; line-height:1.15; }
  .radialNode .radialNodeCount{ font-size:clamp(7px, 1.6vw, 9px); opacity:.75; font-weight:600; }

  .radialHub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:32%; aspect-ratio:1/1; border-radius:50%; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:10px; text-align:center; color:#fff; z-index:3;
    box-shadow:0 10px 26px rgba(20,30,60,.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .radialHub:hover{ transform:translate(-50%,-50%) scale(1.05); box-shadow:0 14px 32px rgba(20,30,60,.34); }
  .radialHub .radialHubIcon{ font-size:clamp(20px, 5.5vw, 30px); }
  .radialHub .radialHubName{ font-size:clamp(9.5px, 2.3vw, 13px); font-weight:800; line-height:1.2; }
  .radialHub .radialHubCount{ font-size:clamp(7.5px, 1.8vw, 10px); opacity:.85; font-weight:600; }

  @media (max-width: 480px){
    .radialWrap{ max-width:420px; }
  }

  .backRow{ margin-bottom:14px; }
  .backBtn{
    background:none; border:none; cursor:pointer; font-size:13px; font-weight:700;
    color:#5a6270; padding:6px 2px; display:inline-flex; align-items:center; gap:6px;
  }
  .backBtn:hover{ color:#141821; }

  .folderHeader{
    display:flex; align-items:center; gap:10px;
    margin:28px 0 6px; padding-bottom:8px;
  }
  .folderHeader:first-child{ margin-top:0; }
  .folderHeader .folderIcon{ font-size:20px; }
  .folderHeader .folderName{
    font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
  }
  .folderHeader .folderLine{ flex:1; height:2px; border-radius:1px; }

  .empty{ text-align:center; color:#b7bcc6; font-size:13px; padding:48px 0; }

  .foot{ margin-top:40px; font-size:11px; color:#b7bcc6; line-height:1.6; }
</style>
</head>

      externalUrl: "https://hubgroupesave-my.sharepoint.com/:x:/r/personal/a_cabanne_aai-france_fr/Documents/TABLEAU%20DE%20BORD%20-%20SAV%20BORDEAUX/Suivi_d_Affaires.xlsm?d=w88f8f3e8d610476aa00cd913e0501d1f&csf=1&web=1&e=U9eEjI",
      desc: "Tableau de bord de suivi des affaires en cours : statut, avancement, dates clés, chiffrage et facturation.",
    },
    {
      name: "Suivi Location Nacelles",
      folder: "logistique",
      tag: "Nacelles",
      color: "#48ADE3",
      icon: "🏗️",
      externalUrl: "https://claude.ai/public/artifacts/9903c4de-8a56-4699-a64d-7c66626c0713",
      desc: "Suivi des réservations de nacelles : chantier, site, dates de livraison/arrêt, loueur — demandes de réservation et d'arrêt par mail.",
    },
    {
      name: "Matrice Commande Matériel",
      folder: "materiel",
      tag: "Matériel",
      color: "#48ADE3",
      icon: "🔩",
      file: "matrice-materiel.xlsx",
      downloadFile: "Matrice_commande_materiel_V3.xlsx",
      mime: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      desc: "Fichier Excel de référence pour les commandes de matériel — téléchargement direct.",
    },
    {
      name: "TCD Stock AAI",
      folder: "materiel",
      tag: "Matériel",
      color: "#48ADE3",
      icon: "📊",
      file: "tcd-stock.xlsx",
      downloadFile: "TCD_STOCK_AAI.xlsx",
      mime: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      desc: "Tableau croisé dynamique du stock AAI — téléchargement direct.",
    },
  ];

  function openTool(tool){
    // Lien externe (ex: artefact Claude publié, SharePoint) : ouverture directe.
    if(tool.externalUrl){
      const win = window.open(tool.externalUrl, '_blank');
      if(!win){
        alert("Le navigateur a bloqué l'ouverture automatique. Autorisez les fenêtres pop-up pour ce site, puis réessayez.");
      }
      return;
    }
    // Fichier à télécharger directement (pas un outil HTML à ouvrir) : lien direct
    // vers le fichier réel (plus besoin de reconstruire un Blob depuis du base64).
    if(tool.downloadFile){
      const a = document.createElement('a');
      a.href = tool.file; a.download = tool.downloadFile;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    // Outil HTML : chaque outil est désormais son propre fichier, chargé à la
    // demande seulement (au clic), au lieu d'être embarqué dans le dashboard.
    const win = window.open(tool.file, '_blank');
    if(!win){
      alert("Le navigateur a bloqué l'ouverture automatique. Autorisez les fenêtres pop-up pour ce site, puis réessayez.");
    }
  }

  const list = document.getElementById('list');
  const emptyMsg = document.getElementById('emptyMsg');

  // Dossiers thématiques regroupant les outils, dans l'ordre d'affichage souhaité.
  const FOLDERS = [
    { id: "gestionaffaire", name: "Gestion d'affaire",  icon: "📊", color: "#7C4DBE" },
    { id: "hse",           name: "HSE / Sécurité",       icon: "⛑️", color: "#1D9E75" },
    { id: "soustraitance", name: "Sous-traitance",       icon: "🤝", color: "#48ADE3" },
    { id: "logistique",    name: "Logistique",           icon: "🚧", color: "#48ADE3" },
    { id: "materiel",      name: "Matériel",             icon: "📦", color: "#48ADE3" },
    { id: "reception",     name: "Réception de chantier",icon: "🏁", color: "#EA3323" },
    { id: "facturation",   name: "Facturation",          icon: "💰", color: "#C9971F" },
  ];

  const folderGrid = document.getElementById('folderGrid');
  const backRow = document.getElementById('backRow');
  let currentFolder = null; // null = écran d'accueil (carrés de dossiers)

  function renderFolderGrid(){
    const others = FOLDERS.filter(f => f.id !== 'gestionaffaire');
    const hub = FOLDERS.find(f => f.id === 'gestionaffaire');
    const wrap = document.createElement('div');
    wrap.className = 'radialWrap';
    const inner = document.createElement('div');
    inner.className = 'radialInner';
    wrap.appendChild(inner);

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'radialLines');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    inner.appendChild(svg);

    const R = 38; // rayon en % du cercle des dossiers autour du centre
    others.forEach((folder, i) => {
      const angle = (2 * Math.PI * i / others.length) - Math.PI / 2;
      const x = 50 + R * Math.cos(angle);
      const y = 50 + R * Math.sin(angle);

      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', '50'); line.setAttribute('y1', '50');
      line.setAttribute('x2', x.toFixed(2)); line.setAttribute('y2', y.toFixed(2));
      line.setAttribute('stroke', folder.color + '55');
      line.setAttribute('stroke-width', '0.6');
      svg.appendChild(line);

      const count = TOOLS.filter(t => t.folder === folder.id).length;
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'radialNode';
      tile.style.left = x + '%';
      tile.style.top = y + '%';
      tile.style.background = folder.color + '14';
      tile.style.borderColor = folder.color + '40';
      tile.innerHTML = `
        <span class="radialNodeIcon">${folder.icon}</span>
        <span class="radialNodeName" style="color:${folder.color};">${folder.name}</span>
        <span class="radialNodeCount" style="color:${folder.color};">${count} outil${count>1?'s':''}</span>
      `;
      tile.addEventListener('click', () => { currentFolder = folder.id; render(''); document.getElementById('search').value = ''; });
      inner.appendChild(tile);
    });

    const hubCount = TOOLS.filter(t => t.folder === hub.id).length;
    const hubBtn = document.createElement('button');
    hubBtn.type = 'button';
    hubBtn.className = 'radialHub';
    hubBtn.style.background = hub.color;
    hubBtn.innerHTML = `
      <span class="radialHubIcon">${hub.icon}</span>
      <span class="radialHubName">${hub.name}</span>
      <span class="radialHubCount">${hubCount} outil${hubCount>1?'s':''}</span>
    `;
    hubBtn.addEventListener('click', () => { currentFolder = hub.id; render(''); document.getElementById('search').value = ''; });
    inner.appendChild(hubBtn);

    folderGrid.innerHTML = '';
    folderGrid.appendChild(wrap);
  }

  function renderBackRow(){
    const folder = FOLDERS.find(fo => fo.id === currentFolder);
    backRow.innerHTML = '';
    if(!folder) return;
    const div = document.createElement('div');
    div.className = 'backRow';
    div.innerHTML = `<button type="button" class="backBtn">← Tous les dossiers</button>`;
    div.querySelector('.backBtn').addEventListener('click', () => { currentFolder = null; render(''); });
    backRow.appendChild(div);

    const header = document.createElement('div');
    header.className = 'folderHeader';
    header.innerHTML = `
      <span class="folderIcon">${folder.icon}</span>
      <span class="folderName" style="color:${folder.color};">${folder.name}</span>
      <span class="folderLine" style="background:${folder.color}25;"></span>
    `;
    list.appendChild(header);
  }

  function renderToolRow(t){
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'row';
    row.innerHTML = `
      <div class="accent" style="background:${t.color};"></div>
      <div class="icon">${t.icon}</div>
      <div class="txt">
        <p class="name">${t.name}</p>
        <p class="desc">${t.desc}</p>
      </div>
      <span class="arrow">${t.externalUrl ? '↗' : (t.downloadFile ? '⬇' : '›')}</span>
    `;
    row.addEventListener('click', () => openTool(t));
    list.appendChild(row);
  }

  function render(filter){
    list.innerHTML = '';
    folderGrid.innerHTML = '';
    backRow.innerHTML = '';
    const f = (filter || '').trim().toLowerCase();
    const filtered = TOOLS.filter(t =>
      !f || t.name.toLowerCase().includes(f) || t.desc.toLowerCase().includes(f) || t.tag.toLowerCase().includes(f)
    );

    if(f){
      // Recherche active : liste groupée par dossier, uniquement les resultats, carres masques
      emptyMsg.style.display = filtered.length ? 'none' : 'block';
      FOLDERS.forEach(folder => {
        const toolsInFolder = filtered.filter(t => t.folder === folder.id);
        if(toolsInFolder.length === 0) return;
        const header = document.createElement('div');
        header.className = 'folderHeader';
        header.innerHTML = `
          <span class="folderIcon">${folder.icon}</span>
          <span class="folderName" style="color:${folder.color};">${folder.name}</span>
          <span class="folderLine" style="background:${folder.color}25;"></span>
        `;
        list.appendChild(header);
        toolsInFolder.forEach(renderToolRow);
      });
      return;
    }

    emptyMsg.style.display = 'none';

    if(currentFolder === null){
      renderFolderGrid();
      return;
    }

    renderBackRow();
    TOOLS.filter(t => t.folder === currentFolder).forEach(renderToolRow);
  }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  render('');
</script>

<script>
  // Enregistrement d'un service worker minimal pour rendre l'app installable
  // (Android/Chrome). Sans effet si le fichier est ouvert en local (file://)
  // ou si le navigateur ne supporte pas les service workers.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
    try {
      const swCode = `
        self.addEventListener('install', () => self.skipWaiting());
        self.addEventListener('activate', () => self.clients.claim());
        self.addEventListener('fetch', () => {}); // passthrough réseau, requis pour l'installabilité
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    } catch (e) { /* silencieux */ }
  }
</script>
